services:
  openwrt-controller:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: openwrt-controller:1.0.0
    container_name: openwrt-controller
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3050}:3000"
    env_file:
      - path: ../../.env.production
        required: false
      - path: ../../.env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - controller-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  controller-data:
    name: openwrt-controller-data
