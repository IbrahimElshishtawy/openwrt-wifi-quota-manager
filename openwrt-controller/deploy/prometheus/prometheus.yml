global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "openwrt-controller"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["openwrt-controller:3000", "localhost:3000"]
        labels:
          environment: "production"
          service: "openwrt-controller"
